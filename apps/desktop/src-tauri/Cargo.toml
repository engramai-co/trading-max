[package]
name = "trading-max-desktop-preview"
version = "1.8.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85.0"

[features]
diagnostics = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-single-instance = "=2.4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "native-tls-no-alpn"] }
tauri-plugin-dialog = "=2.7.3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
