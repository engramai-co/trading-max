name: Bug report
description: Report reproducible incorrect behaviour
title: "[Bug]: "
labels: ["bug"]
body:
  - type: checkboxes
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, account identifiers, portfolio values, and private hostnames.
          required: true
  - type: textarea
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Minimal steps using synthetic or redacted data.
    validations:
      required: true
  - type: input
    attributes:
      label: Version
      placeholder: v1.2.0 or full commit SHA
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: OS, Python, Node, browser, and deployment mode.
    validations:
      required: true
