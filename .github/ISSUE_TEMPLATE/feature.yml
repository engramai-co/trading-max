name: Feature proposal
description: Propose a scoped, maintainable improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: User problem
      description: Describe the decision or workflow this improves.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed outcome
    validations:
      required: true
  - type: textarea
    attributes:
      label: Data, privacy, and failure behaviour
      description: Identify providers, persistence, missing-data behaviour, and recovery impact.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives
      description: What smaller or existing solution did you consider?
