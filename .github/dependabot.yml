version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns: ["*"]
    ignore:
      # These Next versions break Content-Encoding on compressed route responses.
      - dependency-name: "next"
        versions: ["16.4.4", "16.4.5", "16.4.6"]
      - dependency-name: "eslint-config-next"
        versions: ["16.4.4", "16.4.5", "16.4.6"]
      # openapi-typescript requires TypeScript ^5.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # The Next ESLint config's import, accessibility and React plugins require ESLint 9 or older.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
