version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns: ["*"]
    ignore:
      # Next 16.4.5 drops the Content-Encoding label from compressed route
      # responses. Hold 16.4.4–16.4.5 until a browser check passes.
      - dependency-name: "next"
        versions: ["16.4.4", "16.4.5"]
      - dependency-name: "eslint-config-next"
        versions: ["16.4.4", "16.4.5"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
