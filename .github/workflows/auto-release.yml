name: Auto release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: auto-release-${{ github.sha }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  release:
    name: Tag and dispatch release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for protected main checks
        if: github.event_name == 'push'
        env:
          COMMIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          required=(
            "Backend (pytest)"
            "Frontend (lint, types, tests, build)"
            "Secret and artifact scan"
            "Dependency audit"
          )
          deadline=$((SECONDS + 900))
          while true; do
            runs="$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/check-runs?per_page=100")"
            all_passed=true
            for name in "${required[@]}"; do
              conclusion="$(
                jq -r --arg name "$name" \
                  '[.check_runs[] | select(.name == $name)][0].conclusion // "pending"' \
                  <<< "$runs"
              )"
              case "$conclusion" in
                success) ;;
                failure|cancelled|timed_out|action_required)
                  echo "required check failed: ${name} (${conclusion})"
                  exit 1
                  ;;
                *) all_passed=false ;;
              esac
            done
            if [ "$all_passed" = true ]; then
              echo "all protected main checks passed for ${COMMIT_SHA}"
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "timed out waiting for protected main checks"
              exit 1
            fi
            sleep 10
          done

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name == 'workflow_dispatch'
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Validate releasable main commit
        id: release
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main

          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"
          commit="$(git rev-parse HEAD)"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            tagged_commit="$(git rev-list -n 1 "$tag")"
            if git merge-base --is-ancestor "$tagged_commit" "$commit"; then
              echo "${tag} already covers version ${version}; skipping release for ${commit}"
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$tag points to unrelated commit $tagged_commit"
            exit 1
          fi
          previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || true)"
          if [ -n "$previous_tag" ]; then
            python tools/check_version_bump.py --base "${previous_tag#v}" --head "$version"
          else
            python tools/check_version_bump.py --initial --head "$version"
          fi
          python tools/check_version_consistency.py --expected "$version"
          python tools/check_changelog_entry.py --expected "$version"
          python tools/extract_release_notes.py CHANGELOG.md "$version" > /tmp/release-notes.md

          git config user.name "engram-bot"
          git config user.email "engram-bot@users.noreply.github.com"
          git tag -a "$tag" -F /tmp/release-notes.md
          git push origin "$tag"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Dispatch complete release validation and publication
        if: steps.release.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh workflow run release.yml --ref main --field tag="$RELEASE_TAG"
