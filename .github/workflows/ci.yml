name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect operational changes
    runs-on: ubuntu-latest
    outputs:
      operations: ${{ steps.filter.outputs.operations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect migration and deployment changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            operations:
              - ".github/workflows/ci.yml"
              - "backend/migrations/**"
              - "backend/src/trading_max/infrastructure/**"
              - "backend/tests/integration/test_backup_archive.py"
              - "backend/tests/integration/test_restore_backup.py"
              - "backend/tests/unit/test_local_service_installer.py"
              - "services/api/tests/test_local_start.py"
              - "services/api/tests/test_macos_*.py"
              - "tools/restore_backup.py"
              - "tools/verify_backup_archive.py"
              - "deploy/**"
              - "pyproject.toml"
              - "uv.lock"

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install and test Pi model transport
        run: |
          npm run llm:install
          npm run test:llm

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-packages --group dev --frozen

      - name: Repository hygiene
        run: |
          uv run python tools/check_repository_hygiene.py
          uv run python tools/check_release_readiness.py

      - name: OpenAPI contract
        env:
          PYTHONPATH: .
        run: uv run python tools/generate_openapi.py --check

      - name: Backend lint
        run: |
          uv run ruff check backend services/api tools deploy/macos/*.py deploy/local/install-macos-service.py
          uv run ruff format --check backend services/api tools deploy/macos/*.py deploy/local/install-macos-service.py

      - name: Documentation links
        run: uv run python tools/check_documentation.py

      - name: API test suite
        run: uv run pytest services/api/tests

      - name: Backend package tests
        run: uv run pytest backend/tests

      - name: Desktop packaging and presentation guard tests
        run: |
          uv run ruff check apps/desktop/scripts apps/desktop/tests
          uv run ruff format --check apps/desktop/scripts apps/desktop/tests
          uv run python -m unittest discover -s apps/desktop/tests -v
          node --test apps/desktop/tests/*.test.mjs

      - name: Package entry-point smoke
        run: uv run python -c "import trading_max; import services.api.trading_max_api.worker_main"

      - name: Build backend distributions
        run: |
          uv build --package trading-max-backend --out-dir dist/backend
          uv run python tools/check_backend_distribution.py dist/backend

      - name: Python bytecode compile
        run: uv run python -m compileall -q backend/src services/api tools

  desktop-native:
    name: Desktop native (macOS)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Verify pinned updater SDK
        run: uv run --python 3.12 --no-project python apps/desktop/scripts/prepare_sparkle.py
      - name: Install native test toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component clippy,rustfmt
      - name: Native bridge and permission tests
        run: |
          mkdir -p apps/desktop/payload
          cargo +1.94.1 fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
          cargo +1.94.1 test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
          cargo +1.94.1 clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Generated API types
        run: npm run check:api-types

      - name: Frontend architecture
        run: npm run check:architecture

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  operations:
    name: Migration and deployment contracts
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.operations == 'true'
    # The deployment scripts target macOS; its runner ships zsh, so this job no
    # longer depends on an apt mirror being reachable.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync backend dependencies
        run: uv sync --all-packages --group dev --frozen

      - name: Validate macOS shell scripts
        run: for script in deploy/macos/*.sh; do zsh -n "$script"; done

      - name: Validate local workstation shell script
        run: for script in deploy/local/*.sh; do bash -n "$script"; done

      - name: Validate LaunchAgent property lists
        run: |
          uv run python - <<'PY'
          import plistlib
          from pathlib import Path

          paths = sorted(Path("deploy/macos").glob("*.plist"))
          assert paths, "no LaunchAgent property lists found"
          for path in paths:
              with path.open("rb") as stream:
                  plistlib.load(stream)
          PY

      - name: Exercise migrations in a temporary state root
        run: |
          uv run python - <<'PY'
          import tempfile
          from pathlib import Path

          from trading_max.infrastructure import SqliteDatabase

          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              database = SqliteDatabase(
                  root / "trading_max.db",
                  migrations_dir=Path("backend/migrations"),
              )
              try:
                  versions = [
                      row["version"]
                      for row in database.connection.execute(
                          "SELECT version FROM schema_migrations ORDER BY version"
                      ).fetchall()
                  ]
              finally:
                  database.close()
          assert versions[-1] == "0021_estimate_history.sql", versions
          PY

      - name: Exercise backup and restore safety contracts
        run: >
          uv run pytest
          backend/tests/integration/test_backup_archive.py
          backend/tests/integration/test_restore_backup.py
          services/api/tests/test_macos_deploy_contract.py
          services/api/tests/test_macos_release_manager.py
