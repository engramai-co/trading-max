[project]
name = "trading-max-backend"
version = "1.9.1"
description = "Installable domain, application, and worker package for Trading Max Portfolio"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "exchange-calendars>=4.11,<5",
    "httpx>=0.28,<1",
    "keyring>=25,<26",
    "lxml>=6,<7",
    "numpy>=1.26",
    "openpyxl>=3.1,<4",
    "pandas>=2.2",
    "pydantic>=2.11,<3",
    "pypdf>=6.15,<7",
    "xlrd>=2.0,<3",
    "yfinance>=0.2.54",
    "zstandard>=0.25,<0.26",
]

[project.urls]
Documentation = "https://github.com/engramai-co/trading-max#documentation"
Issues = "https://github.com/engramai-co/trading-max/issues"
Repository = "https://github.com/engramai-co/trading-max"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
trading-max = "trading_max.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_max"]
artifacts = ["src/trading_max/reference/data/*.json"]

[tool.hatch.build]
exclude = ["**/node_modules/**", "**/_pi/test/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/trading_max/reference/data/*.json"]
include = [
    "/src/trading_max",
    "/pyproject.toml",
]
